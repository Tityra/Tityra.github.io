<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{% if page.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }} · {{ site.tagline }}{% endif %}</title>
    <meta name="description" content="{{ page.summary | default: site.description | strip_newlines | truncate: 180 }}" />
    <meta name="theme-color" content="#1f2be0" />
    <link rel="canonical" href="{{ page.url | absolute_url }}" />
    <link rel="alternate" type="application/atom+xml" href="{{ '/feed.xml' | relative_url }}" title="{{ site.title }}" />

    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.summary | default: site.description | strip_newlines | truncate: 180 }}" />
    <meta property="og:type" content="{% if page.layout == 'post' %}article{% else %}website{% endif %}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:image" content="{{ '/assets/img/tityra-512.png' | absolute_url }}" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="{{ '/assets/img/tityra-512.png' | absolute_url }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400..500&family=Hanken+Grotesk:wght@400..700&family=DM+Mono:wght@400;500&family=Noto+Serif+KR:wght@500&family=Noto+Sans+KR:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ '/assets/css/styles.css' | relative_url }}?v=5" />
    <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/tityra-32.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="48x48" href="{{ '/assets/img/tityra-48.png' | relative_url }}" />
    <link rel="icon" type="image/png" sizes="96x96" href="{{ '/assets/img/tityra-96.png' | relative_url }}" />
    <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/img/tityra-180.png' | relative_url }}" />
  </head>
  <body>
    <div class="progress" id="progress" aria-hidden="true"></div>
    <div class="wrap">
      <header class="masthead">
        <a class="masthead__mark" href="{{ '/' | relative_url }}">
          <img src="{{ '/assets/img/tityra-96.png' | relative_url }}" alt="" width="34" height="34" />
          <span class="masthead__name">{{ site.title }}</span>
        </a>
        <nav class="masthead__nav">
          <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Briefs</a>
          <a href="{{ '/archive/' | relative_url }}"{% if page.url contains '/archive' %} aria-current="page"{% endif %}>Archive</a>
          <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
        </nav>
      </header>

      {{ content }}

      <!-- The tityra's long tail, drawn as the rule. -->
      <span class="tail" aria-hidden="true">
        <svg viewBox="0 0 1200 14" preserveAspectRatio="none">
          <path fill="currentColor"
                d="M0 7.2 H880 L1010 2.4 L1200 0 L1200 3.2 L1040 6.4 L1180 8.4 L1180 11 L1000 8.6 L878 8.4 H0 Z" />
        </svg>
      </span>

      <footer class="foot">
        <span>{{ site.title }} · {{ site.tagline }}</span>
        <span>
          <a href="{{ '/feed.xml' | relative_url }}">Feed</a> ·
          <a href="https://github.com/Tityra">GitHub</a>
        </span>
      </footer>
    </div>

    <script>
      // Scroll-reveal for rows below the fold. The page is complete without
      // this: the class is only added when motion is welcome, so with
      // JavaScript off, or reduced motion on, everything is simply visible.
      // The deck has a progress indicator; a brief that scrolls wants one too.
      (function () {
        var bar = document.getElementById("progress");
        if (!bar) return;
        var paint = function () {
          var h = document.documentElement.scrollHeight - window.innerHeight;
          bar.style.width = (h > 0 ? (window.scrollY / h) * 100 : 0) + "%";
        };
        paint();
        window.addEventListener("scroll", paint, { passive: true });
        window.addEventListener("resize", paint);
      })();

      (function () {
        var wants = window.matchMedia("(prefers-reduced-motion: reduce)");
        if (wants.matches || !("IntersectionObserver" in window)) return;
        document.body.classList.add("js-reveal");
        var seen = new IntersectionObserver(
          function (entries) {
            entries.forEach(function (entry) {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-in");
              seen.unobserve(entry.target);
            });
          },
          { rootMargin: "0px 0px -8% 0px" }
        );
        document.querySelectorAll(".brief, .month").forEach(function (el, i) {
          el.style.animationDelay = (i % 6) * 0.015 + "s";
          seen.observe(el);
        });
      })();
    </script>
  </body>
</html>
