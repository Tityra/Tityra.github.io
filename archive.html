---
layout: default
title: Archive
permalink: /archive/
---
<section class="lede">
  <h1>Archive</h1>
  <p>Every brief, newest first.</p>
</section>

<ul class="briefs">
  {% for post in site.posts %}
  <li class="brief">
    <div class="brief__meta">
      <time datetime="{{ post.date | date_to_xmlschema }}">{{ post.date | date: "%Y.%m.%d" }}</time>
    </div>
    <div>
      <h2 class="brief__title"><a href="{{ post.url | relative_url }}">{{ post.title }}</a></h2>
      {% if post.summary %}<p class="brief__summary">{{ post.summary }}</p>{% endif %}
    </div>
  </li>
  {% endfor %}
</ul>
