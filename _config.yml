title: Tityra
tagline: Tech news, perched in the open
description: >-
  A daily brief on technology news. Every claim carries its source.
url: https://tityra.github.io
baseurl: ""
lang: en

permalink: /:year/:month/:day/:title/
timezone: Asia/Seoul

# GitHub Pages builds this with its own Jekyll; no plugins beyond the allowlist.
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
  hard_wrap: false

# Language of the posts themselves, and the exact phrases a brief must use.
# Guidelines are always written in English (scripts/check-english.sh enforces
# it); these are content values, referred to by name from those guidelines.
brief:
  post_language: English
  # An empty section is left out of the post; it is named on the Coverage line
  # instead, so a reader can tell "no MCP news" from "did not look at MCP".
  checked_empty: "Checked and empty today"
  no_news_report: "No new items today"

defaults:
  - scope: { path: "", type: "posts" }
    values: { layout: "post" }

exclude:
  - README.md
  - POLICY_NEWS.md
  - USAGE.md
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
